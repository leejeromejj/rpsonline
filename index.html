function rules(){
 $.innerHTML=`<div class="hd"><button class="btn" onclick="go('home')">‹ 뒤로</button><div class="t">게임 규칙</div><span style="width:70px"></span></div><div class="rl">

function why(a,b){
 const X=DEF[a],Y=DEF[b],f=v=>v===Infinity?'∞':v;
 if(X.t=='hum'||Y.t=='hum'){if(X.t==Y.t)return '같은 카드';const o=X.t=='hum'?Y:X;return o.t=='rps'?'마법사는 물리 공격에 취약':(isFinite(o.v)&&o.v>=0?'mod 100 빔 · '+o.v+' mod 100 = '+(o.v%100):'빔이 통하지 않음 · '+f(o.v))}
 if(X.t=='rps'&&Y.t=='rps')return a==b?'같은 카드':'가위바위보 상성';
 const T=q=>q.t=='rps'&&q.tr.includes('use')?'num':q.t,tx=T(X),tz=T(Y),nat=(t,v)=>t=='num'&&Number.isInteger(v)&&v>=1;
 if((X.tr.includes('zero')&&Y.v==0)||(Y.tr.includes('zero')&&X.v==0))return '무한의 허무 · 0에게 패배';
 if(tx=='neg'&&tz=='neg')return '같은 카드';
 if((tx=='neg'&&nat(tz,Y.v))||(tz=='neg'&&nat(tx,X.v)))return '음의정수는 자연수에게 승리';
 if((X.tr.includes('excess')&&Y.v>=5*X.v&&Y.v!==Infinity)||(Y.tr.includes('excess')&&X.v>=5*Y.v&&X.v!==Infinity))return '과유불급 · 5배 이상의 수를 이김';
 return (X.t=='rps'||Y.t=='rps'?'수로 쓰기 · ':'')+f(X.v)+(X.v==Y.v?' = ':X.v>Y.v?' > ':' < ')+f(Y.v)}

function shrink(done){
 const b=B,tw=document.querySelector('.cw.tgt');if(!tw)return;
 const t=b.pc=='MAGE'?b.ec:b.pc,v=DEF[t].v,e=tw.querySelector('b'),cd=tw.querySelector('.card');
 if(!isFinite(v)||v<0){tm.push(setTimeout(()=>{if(B===b&&tw.isConnected)tw.classList.add('blocked')},done?0:300));return}
 const m=v%100,put=x=>{if(e&&t!='PI'){e.textContent=x;if(x<1000)e.style.fontSize='64cqw'}};
 if(done){put(m);cd.classList.add('shrunk');return}
 tm.push(setTimeout(()=>{if(B!==b||!tw.isConnected)return;cd.classList.add('shrunk');const t0=performance.now();(function f(n){if(B!==b||!tw.isConnected)return;const k=Math.min(1,(n-t0)/500);put(Math.round(v+(m-v)*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(f)})(t0)},300))}

 b.pc=b.ph[pi];b.ec=b.eh[ei];b.pu[pi]=1;b.sel=null;b.rv=false;b.res=null;b.ph2='in';{const mp=b.pc=='MAGE',me=b.ec=='MAGE';b.mg=mp!=me&&DEF[mp?b.ec:b.pc].t!='rps'}battle();

function connect(code){

 ch.on('presence',{event:'sync'},()=>{const st=ch.presenceState(),ids=Object.keys(st);
   if(ids.length>2&&!OL.started){toast('방이 가득 찼어요');leaveRoom();return go('online')}

function startPvp(deck){
 deck=(deck||[]).filter(c=>DEF[c]);if(deck.length!=5)return;
 tm.forEach(clearTimeout);tm=[];OL.started=true;OL.st='play';OL.oppDeck=deck;
 B={pvp:1,i:-1,st:{d:deck,p:0},ph:[...G.deck],eh:[...deck],pu:[0,0,0,0,0],eu:[0,0,0,0,0],ps:0,es:0,r:1,sel:null,pc:null,ec:null,res:null,rv:false,lock:false,over:null,drops:[],net:{},w:1,cw:1,pv:6};
 scr='battle';render();tickPv()}
const send=(ev,p)=>{if(OL.ch)OL.ch.send({type:'broadcast',event:ev,payload:p})};
async function sha(t){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
/* 커밋-리빌: 서로 고른 카드의 해시를 먼저 교환하고, 둘 다 고른 뒤에 카드를 공개 */
async function pvpPlay(pi){
 const b=B,r=b.r,n=b.net[r]=b.net[r]||{};
 n.card=b.ph[pi];n.pi=pi;n.nonce=Math.random().toString(36).slice(2);n.h=await sha(n.card+':'+n.nonce);
 send('commit',{r,h:n.h});battle();pvpTry(r)}
async function pvpMsg(t,p){
 const b=B;if(!b||!b.pvp||!p)return;const n=b.net[p.r]=b.net[p.r]||{};
 if(t=='commit')n.oh=p.h;
 else{if(await sha(p.card+':'+p.nonce)!==n.oh||!b.eh.includes(p.card))return toast('상대의 응답이 올바르지 않아요');n.oc=p.card}
 pvpTry(p.r)}
function pvpTry(r){
 const b=B;if(!b||!b.pvp)return;const n=b.net[r];if(!n||n.done)return;
 if(n.h&&n.oh&&!n.sent){n.sent=1;send('reveal',{r,card:n.card,nonce:n.nonce})}
 if(n.sent&&n.oc){n.done=1;let ei=b.eh.findIndex((c,i)=>c==n.oc&&!b.eu[i]);if(ei<0)ei=b.eh.findIndex((c,i)=>!b.eu[i]);round(n.pi,ei)}}
function pvpOver(w,b){
 const t={win:['VICTORY','var(--acc)'],lose:['DEFEAT','var(--lose)'],draw:['DRAW','var(--mute)']}[w];
 return `<div class="ov"><div class="pnl"><h1 style="color:${t[1]}">${t[0]}</h1><div class="sc">${b.ps} : ${b.es}</div>${b.dc?'<div class="oh">상대가 나갔어요</div>':''}<div class="acts">${b.dc?'':`<button class="btn pri" ${b.rm?'disabled':''} onclick="rematch()">${b.rm?'상대를 기다리는 중…':'한 판 더'}</button>`}<button class="btn" onclick="leaveRoom();B=null;go('home')">나가기</button></div></div></div>`}
function rematch(){const b=B;b.rm=1;send('rematch',{});if(b.orm)startPvp(OL.oppDeck);else battle()}
function autoJoin(){const q=new URLSearchParams(location.search).get('room');if(q)setTimeout(()=>{go('online');joinRoom(q)},300)}
render();
autoJoin();
</script>
